<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Driveレコード棚</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="レコード棚">
<meta name="theme-color" content="#F2F1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: three tabs (albums / playlists / songs) in a bottom tab bar, a mini player docked above it, detail pages pushed over each tab. */
:root{
  --bg:#F2F1EC; --surface:#FFFFFF; --ink:#17181C; --muted:#61656E; --line:#DDDCD4;
  --accent:#2C46C4; --accent-ink:#FFFFFF; --accent-soft:#E3E7F8; --warn:#9A3412; --warn-bg:#FBEBDD; --fav:#C8264B;
  --display:"Zen Kaku Gothic New",-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
  --body:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --mini-h:64px; --tab-h:54px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121316; --surface:#1B1C21; --ink:#ECEDF0; --muted:#9CA0AA; --line:#2B2D34;
  --accent:#93A4FF; --accent-ink:#0F1433; --accent-soft:#232A4D; --warn:#FDBA8C; --warn-bg:#3A2418; --fav:#FF7A95;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
img{max-width:100%;display:block}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--mini-h) + var(--tab-h) + 28px + env(safe-area-inset-bottom,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:6px;padding-block:10px 8px;border-bottom:1px solid var(--line);margin-bottom:14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top h1{flex:1;min-width:0;margin:0;font-family:var(--display);font-weight:900;font-size:21px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;flex:none}
.iconbtn:active{background:var(--line)}
.iconbtn svg{width:22px;height:22px;fill:currentColor}

/* generic */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:20px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{color:var(--warn)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn svg{width:18px;height:18px;fill:currentColor}
.btn:disabled{opacity:.5}
.field{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;font:inherit;font-size:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.h2{font-family:var(--display);font-weight:900;font-size:22px;margin:0;text-wrap:balance}
.label{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.code{font-family:var(--mono);font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;word-break:break-all;user-select:all}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-weight:700;font-size:14px}
.banner .btn{height:34px;padding:0 14px}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.search{position:relative;flex:1;min-width:0}
.search svg{position:absolute;left:11px;top:50%;width:18px;height:18px;transform:translateY(-50%);fill:var(--muted);pointer-events:none}
.search input{width:100%;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 14px 0 36px;font:inherit;font-size:16px;-webkit-appearance:none;appearance:none}
.select{height:40px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;font:inherit;font-size:14px;flex:none}
.meta-line{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* album shelf */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px}
.sleeve{text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.cover{position:relative;aspect-ratio:1;width:100%;max-width:100%;border-radius:6px;overflow:hidden;background:var(--line);box-shadow:0 1px 0 rgba(0,0,0,.06),0 6px 16px -10px rgba(0,0,0,.45);flex:none}
.cover img{width:100%;height:100%;object-fit:cover}
.cover .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:44px;color:#fff;letter-spacing:-.02em}
.cover .ph::after{content:"";position:absolute;width:38%;aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,255,255,.35);right:-8%;bottom:-8%}
.cover.thumb{width:42px;border-radius:4px;box-shadow:none}
.cover.thumb .ph{font-size:16px}.cover.thumb .ph::after{display:none}
.sleeve .t{font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sleeve .a{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.empty{padding:40px 8px;text-align:center;color:var(--muted);line-height:1.7;grid-column:1/-1}

/* detail hero */
.hero{display:grid;grid-template-columns:min(42%,220px) 1fr;gap:18px;align-items:end;margin-bottom:18px}
.hero .meta{display:flex;flex-direction:column;gap:6px;min-width:0}
@media (max-width:420px){.hero{grid-template-columns:1fr}.hero .cover{max-width:240px}}
.pl-art{display:grid;grid-template-columns:1fr 1fr;aspect-ratio:1;border-radius:6px;overflow:hidden;background:var(--line)}
.pl-art .cover{border-radius:0;box-shadow:none}
.pl-art.fav{display:grid;place-items:center;background:linear-gradient(135deg,var(--fav),color-mix(in srgb,var(--fav) 55%,#000))}
.pl-art.fav svg{width:42%;height:42%;fill:#fff}
@media (max-width:420px){.hero .pl-art{max-width:240px}}

/* track rows */
.tracks{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.trk{display:grid;grid-template-columns:1fr auto;align-items:center;border-bottom:1px solid var(--line)}
.trk-main{display:grid;grid-template-columns:42px 1fr 16px;align-items:center;gap:12px;text-align:left;padding:9px 0 9px 2px;min-width:0;min-height:56px}
.trk .n{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;padding-right:4px}
.trk .nm{min-width:0}
.trk .tt{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trk .nm small{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.trk.on .tt{color:var(--accent);font-weight:700}
.trk .more{color:var(--muted)}
.trk .st{display:grid;place-items:center}
.disc-h{padding:14px 4px 6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:.75}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:var(--accent);animation:eq 1s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
.eq.paused i{animation-play-state:paused}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
@media (prefers-reduced-motion:reduce){.eq i{animation:none;height:10px}}

/* playlist list & folder picker */
.list{list-style:none;margin:0;padding:0}
.list > li > button{width:100%;text-align:left;padding:10px 2px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;min-height:62px}
.list .grow{flex:1;min-width:0}
.list .grow b,.list .grow span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .grow span{font-size:13px;color:var(--muted);margin-top:2px}
.list .ico{width:46px;height:46px;flex:none;border-radius:6px;display:grid;place-items:center;background:var(--accent-soft)}
.list .ico svg{width:22px;height:22px;fill:var(--accent)}
.list .ico.fav{background:var(--fav)}.list .ico.fav svg{fill:#fff}
.list .ico.plain{background:none}.list .ico.plain svg{fill:var(--muted)}
.list .ico .cover{width:46px;border-radius:6px;box-shadow:none}

/* tab bar + mini player */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs .in{max-width:760px;margin:0 auto;display:flex}
.tabs button{flex:1;height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
.tabs button svg{width:24px;height:24px;fill:currentColor}
.tabs button.on{color:var(--accent)}
.mini{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + 1px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
body.notabs .mini{bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}
.mini .bar{position:absolute;left:0;top:-1px;height:2px;background:var(--accent);width:0}
.mini .in{max-width:760px;margin:0 auto;height:var(--mini-h);display:flex;align-items:center;gap:8px}
.mini .open{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left}
.mini .cover{width:44px;border-radius:4px}
.mini .cover .ph{font-size:18px}
.mini .txt{min-width:0}
.mini .txt b,.mini .txt span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .txt span{font-size:12px;color:var(--muted)}

/* full player */
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));overflow-y:auto}
.sheet .grab{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-block:8px}
.sheet .grab .label{flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player{flex:1;max-width:440px;width:100%;margin:0 auto;display:flex;flex-direction:column;justify-content:center;gap:20px}
.player .cover{border-radius:8px;box-shadow:0 20px 40px -24px rgba(0,0,0,.6)}
.player .ttl{font-family:var(--display);font-weight:900;font-size:21px;line-height:1.35;text-wrap:balance}
.seek{width:100%;accent-color:var(--accent);height:24px}
.times{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ctrl{display:flex;align-items:center;justify-content:space-between}
.ctrl .iconbtn svg{width:24px;height:24px}
.ctrl .big{width:68px;height:68px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.ctrl .big svg{width:30px;height:30px;fill:currentColor}
.ctrl .mid svg{width:30px;height:30px}
.toggle{position:relative;color:var(--muted)}
.toggle.on{color:var(--accent)}
.toggle .one{position:absolute;right:4px;bottom:4px;font-family:var(--mono);font-size:10px;font-weight:700}
#favBtn.on{color:var(--fav)}

/* action sheet */
.menu-back{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.38);display:flex;align-items:flex-end;justify-content:center}
.menu{background:var(--surface);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:6px 0 calc(10px + env(safe-area-inset-bottom,0px));max-height:82vh;overflow-y:auto}
.menu .mt{padding:12px 20px 8px;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid var(--line)}
.menu > button{display:flex;gap:14px;align-items:center;width:100%;padding:14px 20px;text-align:left;font-size:16px}
.menu > button svg{width:20px;height:20px;fill:currentColor;flex:none;opacity:.8}
.menu > button.danger{color:var(--warn)}
.menu > button.cancel{justify-content:center;color:var(--muted);border-top:1px solid var(--line);margin-top:4px}
.menu form{padding:16px 20px 6px;display:flex;flex-direction:column;gap:12px}

/* settings */
.settings dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px}
.settings dt{color:var(--muted)}
.settings dd{margin:0;min-width:0;word-break:break-all;font-variant-numeric:tabular-nums}
.switch{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.switch input{appearance:none;-webkit-appearance:none;flex:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;cursor:pointer;transition:background .15s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(20px)}
.usage{list-style:none;margin:0;padding:0}
.usage li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.usage li:last-child{border-bottom:0}
.usage .grow{flex:1;min-width:0}
.usage .grow b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.usage .grow span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--mini-h) + var(--tab-h) + 18px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 8px 24px -12px rgba(0,0,0,.5)}
.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h5l2 2h8A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M11 4h2v8.2l3.1-3.1 1.4 1.4L12 16l-5.5-5.5 1.4-1.4 3.1 3.1zM5 18h14v2H5z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m9.5 16.2-4.2-4.2-1.4 1.4 5.6 5.6 11-11-1.4-1.4z"/></symbol>
  <symbol id="i-album" viewBox="0 0 24 24"><path d="M4 4h16v16H4zm2 2v12h12V6zm6 2.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7zm0 2.5a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/></symbol>

    const blob = await getBlob(C_AUDIO, t.id);
    if (seq !== loadSeq) return;
    if (curURL) URL.revokeObjectURL(curURL);
    curURL = URL.createObjectURL(blob);
    audio.src = curURL;
    if (seek) audio.addEventListener('loadedmetadata', () => { audio.currentTime = seek; }, { once: true });
    if (autoplay) await audio.play();
    cached.add(t.id);
    updatePlayerUI(); setMediaSession(); saveResume(); prefetch();
    if (!S.tags[t.id]) enrichTags();
  } catch (e) {
    if (seq !== loadSeq) return;
    updatePlayerUI();
    if (e instanceof AuthNeeded) toast('この曲はまだ端末に保存されていません。Googleに再接続してください');
    else if (e.name === 'NotAllowedError') toast('再生ボタンをもう一度押してください');
    else toast('再生できませんでした：' + t.title);
  }
}
let prefetching = false;
async function prefetch() {
  if (prefetching || !tokenOk()) return;
  prefetching = true;
  try {
    const ahead = S.autoSave ? Math.min(30, S.queue.length - 1) : Math.min(1, S.queue.length - 1);
    for (let k = 1; k <= ahead; k++) {
      const idx = S.qi + k; if (idx >= S.queue.length && S.repeat !== 'all') break;
      const t = S.queue[idx % S.queue.length];
      if (!cached.has(t.id)) { await getBlob(C_AUDIO, t.id); refreshRows(); }
    }
  } catch {}
  prefetching = false;
}
function next(auto) {
  if (!S.queue.length) return;
  if (auto && S.repeat === 'one') { audio.currentTime = 0; audio.play().catch(() => {}); return; }
  if (S.qi + 1 >= S.queue.length) {
    if (S.repeat === 'off' && auto) { audio.pause(); audio.currentTime = 0; updatePlayerUI(); return; }
    S.qi = 0;
  } else S.qi++;
  loadAndPlay(true, 0);
}
function prev() {
  if (!S.queue.length) return;
  if (audio.currentTime > 3 || S.qi === 0) { audio.currentTime = 0; return; }
  S.qi--; loadAndPlay(true, 0);
}
function togglePlay() {
  if (S.qi < 0) return;
  unlock();
  if (!curURL) { loadAndPlay(true, S.pendingSeek); return; }
  if (audio.paused) audio.play().catch(() => toast('再生できませんでした')); else audio.pause();
}

/* 続きから再生 */
function resumeSnapshot() { const t = curTrack(); return t ? { ids: S.base.map(x => x.id), trackId: t.id, time: audio.currentTime || S.pendingSeek || 0, ctx: S.ctx } : ls.get('resume', null); }
function saveResume() { const r = resumeSnapshot(); if (r) ls.set('resume', r); }
function restoreResume() {
  const r = ls.get('resume', null); if (!r) return;
  let ids = r.ids, ctx = r.ctx;
  if (!ids && r.albumId) { const a = S.library.find(x => x.id === r.albumId); if (!a) return; ids = a.tracks.map(t => t.id); ctx = { type: 'album', id: a.id, title: a.title }; }
  const base = (ids || []).map(id => IDX.get(id)?.t).filter(Boolean);
  if (!base.some(t => t.id === r.trackId)) return;
  S.base = base; S.ctx = ctx || null;
  applyShuffle(r.trackId);
  S.pendingSeek = r.time || 0;
  updatePlayerUI();
}

/* 表示の同期 */
function setIcon(btn, id) { btn.querySelector('use').setAttribute('href', '#' + id); }
function updatePlayerUI(loading) {
  const t = curTrack(), a = albumOf(t);
  $('#mini').hidden = !t;
  if (!t) return;
  const sub = [t.artist || a?.artist, a?.title].filter(Boolean).join(' — ');
  $('#miniTitle').textContent = t.title; $('#miniSub').textContent = sub;
  $('#pTitle').textContent = t.title; $('#pSub').textContent = sub;
  const ctx = S.ctx, where = !ctx ? '' : ctx.type === 'album' ? 'アルバム' : ctx.type === 'playlist' ? (plGet(ctx.id)?.name || ctx.title) : ctx.title;
  $('#sheetPos').textContent = `${where ? where + '　' : ''}${S.qi + 1} / ${S.queue.length}`;
  const key = (a ? artKey(a) || '' : '') + '|' + (a?.id || '');
  if ($('#miniCover').dataset.key !== key) {
    $('#miniCover').replaceWith(Object.assign(coverEl(a), { id: 'miniCover' })); $('#miniCover').dataset.key = key;
    $('#pCover').replaceWith(Object.assign(coverEl(a), { id: 'pCover' }));
  }
  const playing = !audio.paused && !!curURL;
  for (const b of [$('#miniPlay'), $('#playBtn')]) {
    if (loading) b.replaceChildren(h('span', { class: 'spin' }));
    else { if (!b.querySelector('use')) b.replaceChildren(icon('i-play')); setIcon(b, playing ? 'i-pause' : 'i-play'); }
    b.setAttribute('aria-label', playing ? '一時停止' : '再生');
  }
  const f = isFav(t.id);
  $('#favBtn').classList.toggle('on', f); setIcon($('#favBtn'), f ? 'i-heart' : 'i-heart-o');
  $('#favBtn').setAttribute('aria-label', f ? 'お気に入りから外す' : 'お気に入りに追加');
  $('#shufBtn').classList.toggle('on', S.shuffle);
  $('#repBtn').classList.toggle('on', S.repeat !== 'off');
  $('#repOne').hidden = S.repeat !== 'one';
  refreshRows();
  updateTime();
}
let dragging = false;
function updateTime() {
  const d = audio.duration, c = audio.currentTime;
  const dur = isFinite(d) ? d : 0;
  $('#tCur').textContent = fmt(curURL ? c : S.pendingSeek); $('#tDur').textContent = fmt(dur);
  if (!dragging) $('#seek').value = dur ? Math.round(c / dur * 1000) : 0;
  $('#miniBar').style.width = dur ? (c / dur * 100) + '%' : '0';
}

/* ロック画面・コントロールセンター */
function setMediaSession() {
  if (!('mediaSession' in navigator)) return;
  const t = curTrack(), a = albumOf(t); if (!t) return;
  const art = a && coverURLs.get(artKey(a));
  if (a && !art && artKey(a)) artURL(a).then(u => { if (u && curTrack() === t) setMediaSession(); });
  try {
    navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist || a?.artist || '', album: a?.title || '', artwork: art ? [{ src: art, sizes: '512x512' }] : [{ src: 'icons/icon-512.png', sizes: '512x512', type: 'image/png' }] });
  } catch {}
}
function setPositionState() {
  if (!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState) return;
  const d = audio.duration; if (!isFinite(d) || !d) return;
  try { navigator.mediaSession.setPositionState({ duration: d, position: Math.min(audio.currentTime, d), playbackRate: audio.playbackRate }); } catch {}
}
if ('mediaSession' in navigator) {
  const set = (k, f) => { try { navigator.mediaSession.setActionHandler(k, f); } catch {} };
  set('play', () => togglePlay()); set('pause', () => audio.pause());
  set('nexttrack', () => next(false)); set('previoustrack', () => prev());
  set('seekto', e => { audio.currentTime = e.seekTime; setPositionState(); });
}

audio.addEventListener('ended', () => { if (curURL) next(true); });
audio.addEventListener('play', () => { if (curURL) { updatePlayerUI(); if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing'; } });
audio.addEventListener('pause', () => { if (curURL) { updatePlayerUI(); saveResume(); if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused'; } });
audio.addEventListener('loadedmetadata', () => { updateTime(); setPositionState(); });
let lastSave = 0;
audio.addEventListener('timeupdate', () => {
  if (!curURL) return;
  updateTime();
  if (Date.now() - lastSave > 5000) { lastSave = Date.now(); saveResume(); setPositionState(); }
});

/* 操作 */
$('#miniPlay').onclick = togglePlay;
$('#playBtn').onclick = togglePlay;
$('#miniNext').onclick = () => { unlock(); next(false); };
$('#nextBtn').onclick = () => { unlock(); next(false); };
$('#prevBtn').onclick = () => { unlock(); prev(); };
$('#miniOpen').onclick = () => { $('#sheet').hidden = false; updatePlayerUI(); };
$('#sheetClose').onclick = () => { $('#sheet').hidden = true; };
$('#favBtn').onclick = () => { const t = curTrack(); if (t) toggleFav(t.id); };
$('#shufBtn').onclick = () => { S.shuffle = !S.shuffle; ls.set('shuffle', S.shuffle); const t = curTrack(); if (t) applyShuffle(t.id); updatePlayerUI(); };
$('#repBtn').onclick = () => { S.repeat = { off: 'all', all: 'one', one: 'off' }[S.repeat]; ls.set('repeat', S.repeat); updatePlayerUI(); toast({ off: 'リピートしない', all: 'すべてリピート', one: '1曲をリピート' }[S.repeat]); };
const seek = $('#seek');
seek.addEventListener('input', () => { dragging = true; const d = audio.duration; if (isFinite(d)) $('#tCur').textContent = fmt(seek.value / 1000 * d); });
seek.addEventListener('change', () => { const d = audio.duration; if (isFinite(d) && curURL) audio.currentTime = seek.value / 1000 * d; dragging = false; setPositionState(); });
$('#backBtn').onclick = () => go({ name: S.view.parent || S.tab });
$('#settingsBtn').onclick = () => go({ name: 'settings', parent: S.tab });
$('#refreshBtn').onclick = refresh;
$('#reauthBtn').onclick = () => { if (!audio.paused) { toast('再生を止めてから再接続してください'); return; } login(true); };
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  if (S.tab === b.dataset.tab && S.view.name === b.dataset.tab) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  goTab(b.dataset.tab);
});

/* ================= boot ================= */
(async function boot() {
  readAuthRedirect();
  await loadCachedIndex();
  for (const a of S.library) {
    if (a.folderTitle == null) { a.folderTitle = a.title; a.folderArtist = a.artist; }
    for (const t of a.tracks) if (t.fileTitle == null) { t.fileTitle = t.title; t.fileNo = t.no; }
  }
  fav();
  applyTags();
  if (S.view.name === 'settings' || S.view.name === 'library') S.view = { name: S.tab };
  restoreResume();
  render();
  if (S.clientId && S.root && tokenOk() && (!S.library.length || Date.now() - S.scannedAt > 6 * 3600 * 1000)) refresh();
  else if (S.library.length) enrichTags();
  if (S.clientId && S.root && !tokenOk() && !S.library.length) needAuth();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
